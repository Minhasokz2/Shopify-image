# Shopify app configuration for MotionArt.
# client_id is still a placeholder — it's a real credential this environment doesn't have
# access to. Replace it via `shopify app config link` against the real Partner Dashboard app
# record (pulls client_id automatically), or paste it in by hand before running the Shopify CLI
# against this file. application_url/redirect_urls below are the real production values.
name = "MotionArt"
client_id = "REPLACE_WITH_SHOPIFY_API_KEY"
application_url = "https://splugin.linkgrab.io"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_product_listings"

[auth]
redirect_urls = [
  "https://splugin.linkgrab.io/auth/callback"
]

# Pinned to match server/src/config/shopify.js's ADMIN_API_VERSION. Keep these in sync — the
# TOML value governs webhook payload versions, the JS constant governs Admin GraphQL/REST calls.
[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

# The 3 mandatory GDPR webhooks use `compliance_topics`, not `topics` — a distinct TOML field
# from Shopify's regular app-specific webhook subscriptions. Shopify sends these to every public
# app regardless of granted scopes, and the App Store review's "Provides mandatory compliance
# webhooks" automated check specifically looks for entries under this field, not `topics` with a
# matching name (confirmed via shopify.dev's own documented shopify.app.toml examples).
[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/shop/redact"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "/webhooks/app_subscriptions/update"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""
